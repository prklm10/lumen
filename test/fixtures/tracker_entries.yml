<% today = Time.find_zone("Asia/Kolkata").today %>
<% [0, 1, 2, 5].each do |d| %>
meditate_<%= d %>:
  tracker: meditate
  logged_on: <%= today - d %>
  value: 1
<% end %>

water_yesterday:
  tracker: water
  logged_on: <%= today - 1 %>
  value: 9
  note: Hot day

water_two_days_ago:
  tracker: water
  logged_on: <%= today - 2 %>
  value: 3
